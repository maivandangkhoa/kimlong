# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: maivandangkhoa/kimlong
  branch: main
  identity_url: https://auth.decapbridge.com/sites/5fcb67da-a43a-4b8f-aaa0-08e16ff7a44f
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://quatangdoanhnghiepdanang.com

# Đường dẫn lưu trữ hình ảnh upload
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Cấu hình ngôn ngữ hiển thị CMS
locale: "vi"

# Danh mục nội dung quản lý
collections:
  - name: "posts"
    label: "Bài viết / Tin tức"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Tiêu đề bài viết", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm" }
      - { label: "Ảnh đại diện", name: "image", widget: "image", required: false }
      - { label: "Tóm tắt ngắn", name: "summary", widget: "text", required: false }
      - { label: "Nội dung bài viết", name: "body", widget: "markdown" }
      - { label: "Hiển thị lên website", name: "published", widget: "boolean", default: true }
