name: Update Posts Index

on:
  push:
    paths:
      - 'content/posts/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static posts & sitemap
        run: |
          python3 scripts/build-posts.py

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts.json bai-viet/ sitemap.xml robots.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate static posts, sitemap and posts index [skip ci]" && git push)

